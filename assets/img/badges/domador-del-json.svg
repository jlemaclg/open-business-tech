<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Domador del JSON">
  <defs>
    <linearGradient id="djs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F062A"/>
      <stop offset="100%" stop-color="#260717"/>
    </linearGradient>
  </defs>

  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55"
           fill="url(#djs-bg)" stroke="#FF0054" stroke-width="3"/>
  <polygon points="100,30 162,65 162,135 100,170 38,135 38,65"
           fill="none" stroke="#FF0054" stroke-width="1" opacity="0.4"/>

  <!-- Llaves { y } estilizadas -->
  <text x="62" y="125" font-family="Georgia, serif" font-size="72" fill="#FF0054" font-weight="400">{</text>
  <text x="118" y="125" font-family="Georgia, serif" font-size="72" fill="#FF0054" font-weight="400">}</text>

  <!-- Tres puntos centrales (representan "..." o tres pares) -->
  <circle cx="92" cy="100" r="3" fill="#FF0054"/>
  <circle cx="100" cy="100" r="3" fill="#FF0054"/>
  <circle cx="108" cy="100" r="3" fill="#FF0054"/>
</svg>
